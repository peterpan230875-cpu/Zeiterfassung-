<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Super-Admin Portal — Zeiterfassung v2.8</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

/* ── TOKENS ─────────────────────────────────────────────────────────────── */
:root {
  --bg:#F0EDE8; --bg2:#E8E4DE;
  --sur:#FFFFFF; --sur2:#FAFAF8;
  --brd:#DDD8CF;
  --txt:#18160F; --txt2:#6B6560; --muted:#A09890;
  --blue:#2563EB; --blue-s:#3B82F6; --blue-bg:#EFF6FF; --blue-m:#BFDBFE;
  --green:#16A34A; --green-bg:#F0FDF4; --green-m:#BBF7D0;
  --red:#DC2626; --red-bg:#FEF2F2; --red-m:#FECACA;
  --amber:#D97706; --amber-bg:#FEF3C7; --amber-m:#FDE68A;
  --r:12px; --rs:8px;
  --sh-sm:0 1px 3px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --sh:0 2px 8px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);
}
body.dark {
  --bg:#0D0D0F; --bg2:#16161A;
  --sur:#16161A; --sur2:#1C1C20;
  --brd:#28282E;
  --txt:#F5F5F7; --txt2:#A1A1A8; --muted:#6E6E75;
  --blue:#3B82F6; --blue-s:#60A5FA; --blue-bg:#1A2640; --blue-m:#1E3860;
  --green:#34D399; --green-bg:#0C2318; --green-m:#134530;
  --red:#F87171; --red-bg:#2A1010; --red-m:#4A1A1A;
  --amber:#FCD34D; --amber-bg:#2A1E05; --amber-m:#4A360A;
}

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Figtree',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;}

/* ── HEADER ─────────────────────────────────────────────────────────────── */
#hdr{
  position:sticky;top:0;z-index:40;
  background:rgba(22,22,26,.97);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid #28282E;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
body.dark #hdr{background:rgba(22,22,26,.97);}
#hdr-top{
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;
}
#app-title{
  font-size:16px;font-weight:700;letter-spacing:-.3px;
  color:#F5F5F7;display:flex;align-items:center;gap:7px;
}
#app-title::before{
  content:'';width:7px;height:7px;border-radius:50%;
  background:#8B5CF6;box-shadow:0 0 0 3px rgba(139,92,246,.2);
}
.badge{
  font-size:9px;color:#A1A1A8;font-family:'JetBrains Mono',monospace;
  background:#1C1C20;border:1px solid #28282E;border-radius:6px;
  padding:3px 8px;font-weight:600;letter-spacing:.5px;
}
#hdr-spacer{flex:1;}
#hdr-btns{display:flex;gap:6px;align-items:center;}
.hbtn{
  padding:5px 10px;border-radius:6px;border:1px solid #28282E;
  background:#1C1C20;font-family:'Figtree',sans-serif;
  font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;gap:4px;color:#A1A1A8;
}
.hbtn:hover{background:#242428;color:#F5F5F7;}
.hbtn-red{background:#2A1010;color:#F87171;border-color:#4A1A1A;}
.hbtn-red:hover{background:#3A1515;}

/* ── CONTAINER ──────────────────────────────────────────────────────────── */
.container{display:flex;height:calc(100vh - 45px);background:#0D0D0F;}

/* ── SIDEBAR ────────────────────────────────────────────────────────────── */
.sidebar{
  width:260px;background:#16161A;border-right:1px solid #28282E;
  overflow-y:auto;padding:12px;
}
.sidebar h2{
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.8px;color:#6E6E75;margin-bottom:10px;padding:0 8px;
}
.employee-list{list-style:none;}
.employee-item{
  padding:9px 10px;background:#1C1C20;border:1px solid #28282E;
  border-radius:7px;margin-bottom:5px;cursor:pointer;transition:all .12s;
}
.employee-item:hover{background:#242428;border-color:#3B82F6;}
.employee-item.active{
  background:#1A2640;border-color:#3B82F6;
  box-shadow:0 0 0 2px rgba(59,130,246,.15);
}
.employee-name{font-weight:600;color:#F5F5F7;font-size:13px;}
.employee-user{
  font-size:10px;color:#6E6E75;margin-top:2px;
  font-family:'JetBrains Mono',monospace;
}

/* ── MAIN ───────────────────────────────────────────────────────────────── */
.main{flex:1;padding:16px;overflow-y:auto;max-width:1100px;margin:0 auto;width:100%;}

/* Month Nav */
.month-nav{
  display:flex;justify-content:space-between;align-items:center;
  background:#16161A;border:1px solid #28282E;
  border-radius:10px;padding:10px 14px;margin-bottom:14px;
}
.month-nav h2{
  font-size:15px;font-weight:700;color:#F5F5F7;
  display:flex;align-items:center;gap:8px;
}
.live-badge{
  display:inline-block;background:#34D399;color:#000;
  padding:2px 8px;border-radius:5px;font-size:9px;font-weight:700;
  letter-spacing:.6px;animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.7;}}
.nav-btns{display:flex;gap:6px;}
.nav-btn{
  padding:5px 12px;border-radius:6px;border:1px solid #28282E;
  background:#1C1C20;cursor:pointer;font-weight:600;font-size:12px;
  color:#A1A1A8;transition:all .12s;font-family:'Figtree',sans-serif;
}
.nav-btn:hover{background:#242428;color:#F5F5F7;}

/* ── STATS ──────────────────────────────────────────────────────────────── */
#stats{
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:8px;margin-bottom:14px;
}
.sc{
  background:#16161A;border:1px solid #28282E;border-radius:8px;
  padding:8px 10px;position:relative;overflow:hidden;
}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.sc:nth-child(1)::before{background:#3B82F6;}
.sc:nth-child(2)::before{background:#34D399;}
.sc:nth-child(3)::before{background:#F87171;}
.sc:nth-child(4)::before{background:#FCD34D;}
.sc:nth-child(5)::before{background:#34D399;}
.sc-lbl{
  font-size:8px;color:#6E6E75;font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px;
}
.sc-val{
  font-family:'JetBrains Mono',monospace;font-size:15px;
  font-weight:700;color:#F5F5F7;line-height:1.2;
}
.sc-sub{
  font-size:9px;color:#6E6E75;margin-top:2px;
  font-family:'JetBrains Mono',monospace;
}

/* ── TABLE ──────────────────────────────────────────────────────────────── */
#tbl-wrap{
  background:#16161A;border:1px solid #28282E;
  border-radius:10px;overflow:hidden;
}
table{width:100%;border-collapse:collapse;}
thead tr{background:#1C1C20;border-bottom:1px solid #28282E;}
thead th{
  font-size:9px;font-weight:700;text-transform:uppercase;
  letter-spacing:.8px;color:#6E6E75;padding:9px 10px;text-align:left;
}
tbody td{
  padding:9px 10px;font-size:12px;border-bottom:1px solid #1C1C20;
  color:#F5F5F7;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr{background:#16161A;}
tbody tr:hover{background:#1C1C20;}

/* Wochentag-Farben */
tbody tr.wk-sa{background:#2A1E05!important;}
tbody tr.wk-so{background:#2A1E05!important;}
tbody tr.holiday{background:#2A1010!important;}
tbody tr.wk-sa:hover{background:#3A2810!important;}
tbody tr.wk-so:hover{background:#3A2810!important;}
tbody tr.holiday:hover{background:#3A1515!important;}

/* KW Badge */
.kw-badge{
  display:inline-block;background:#1A2640;color:#60A5FA;
  border:1px solid #1E3860;border-radius:5px;
  padding:2px 7px;font-size:9px;font-weight:700;
  font-family:'JetBrains Mono',monospace;letter-spacing:.3px;
  margin-left:4px;
}

/* Spalten */
.td-tag{font-family:'JetBrains Mono',monospace;font-size:12px;color:#A1A1A8;font-weight:600;}
.td-wt{font-size:11px;font-weight:600;color:#F5F5F7;}
.td-von{font-size:12px;color:#F5F5F7;display:flex;align-items:center;gap:4px;}
.td-time{font-family:'JetBrains Mono',monospace;font-size:12px;color:#F5F5F7;}
.td-netto{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:12px;color:#34D399;}
.td-bem{font-size:11px;color:#A1A1A8;}

/* Typen */
.type-za{color:#34D399!important;}
.type-urlaub{color:#60A5FA!important;}
.type-krank{color:#F87171!important;}
.type-holiday{color:#F87171!important;}

.empty{
  text-align:center;padding:50px 20px;color:#6E6E75;font-size:14px;
}

/* Footer */
.footer{
  margin-top:16px;padding:12px;text-align:center;
  border-top:1px solid #28282E;
  font-size:10px;color:#6E6E75;
  font-family:'JetBrains Mono',monospace;
}
</style>
</head>
<body class="dark">

<!-- Header -->
<div id="hdr">
  <div id="hdr-top">
    <div id="app-title">
      🔐 Super-Admin Portal
      <span class="badge">READ-ONLY</span>
    </div>
    <div style="font-size:9px;color:#6E6E75;font-family:'JetBrains Mono',monospace;margin-left:6px;">v2.8</div>
    <div id="hdr-spacer"></div>
    <div id="hdr-btns">
      <button class="hbtn" onclick="toggleDarkMode()" id="darkModeBtn">☀️</button>
      <button class="hbtn hbtn-red" onclick="logout()">🚪 Abmelden</button>
    </div>
  </div>
</div>

<!-- Container -->
<div class="container">
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>👥 Mitarbeiter</h2>
    <ul id="employeeList" class="employee-list"></ul>
  </div>

  <!-- Main -->
  <div class="main">
    <div id="content">
      <div class="empty">👈 Wähle einen Mitarbeiter aus der Liste</div>
    </div>

    <div class="footer">
      📊 Read-Only · Wochenstunden Soll: <span id="footerWoStd">--</span> h · Tagessoll: <span id="footerTagStd">--</span> h<br>
      Zeiterfassung v2.8 · Entwickelt von S.Michlenz
    </div>
  </div>
</div>

<script>
let employees=[];
let selectedUserId=null;
let currentYear=new Date().getFullYear();
let currentMonth=new Date().getMonth()+1;
let darkMode=true;
let currentSettings=null;

async function loadEmployees(){
  try{
    const res=await fetch('/api/super-admin/all-users');
    if(!res.ok){
      if(res.status===401)window.location.href='/';
      return;
    }
    employees=await res.json();
    renderEmployeeList();
  }catch(ex){
    console.error('Fehler beim Laden der Mitarbeiter:',ex);
  }
}

function renderEmployeeList(){
  const list=document.getElementById('employeeList');
  list.innerHTML=employees.map(emp=>`
    <li class="employee-item ${selectedUserId===emp.id?'active':''}" onclick="selectEmployee('${emp.id}')">
      <div class="employee-name">${emp.name}</div>
      <div class="employee-user">@${emp.username}</div>
    </li>
  `).join('');
}

async function selectEmployee(userId){
  selectedUserId=userId;
  renderEmployeeList();
  await loadEmployeeData();
}

async function loadEmployeeData(){
  if(!selectedUserId)return;

  const emp=employees.find(e=>e.id===selectedUserId);
  if(!emp)return;

  try{
    const [entriesRes,settingsRes]=await Promise.all([
      fetch(`/api/super-admin/entries/${selectedUserId}?year=${currentYear}&month=${currentMonth}`),
      fetch(`/api/super-admin/settings/${selectedUserId}`)
    ]);

    if(!entriesRes.ok||!settingsRes.ok){
      document.getElementById('content').innerHTML='<div class="empty">Fehler beim Laden der Daten</div>';
      return;
    }

    const entries=await entriesRes.json();
    const settings=await settingsRes.json();
    currentSettings=settings;

    renderEmployeeData(emp,entries,settings);
  }catch(ex){
    console.error('Fehler:',ex);
  }
}

function getWeekNumber(date){
  const d=new Date(date);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate()+3-(d.getDay()+6)%7);
  const week1=new Date(d.getFullYear(),0,4);
  return 1+Math.round(((d-week1)/86400000-3+(week1.getDay()+6)%7)/7);
}

function getDayName(date){
  const d=new Date(date);
  const days=['So','Mo','Di','Mi','Do','Fr','Sa'];
  return days[d.getDay()];
}

function renderEmployeeData(emp,entries,settings){
  const monthNames=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

  // Footer aktualisieren
  const tagSoll=(settings.wochenstunden/5).toFixed(2);
  document.getElementById('footerWoStd').textContent=settings.wochenstunden.toFixed(1);
  document.getElementById('footerTagStd').textContent=tagSoll;

  // Berechne Statistiken
  let workHours=0;
  entries.forEach(e=>{
    if(e.type==='normal'&&e.von&&e.bis){
      const h1=parseInt(e.von.split(':')[0])*60+parseInt(e.von.split(':')[1]);
      const h2=parseInt(e.bis.split(':')[0])*60+parseInt(e.bis.split(':')[1]);
      workHours+=(h2-h1-e.pause)/60;
    }
  });

  const urlaubDays=entries.filter(e=>e.type==='urlaub').length;
  const zaDays=entries.filter(e=>e.type==='zeitausgleich').length;
  const krankDays=entries.filter(e=>e.type==='krank').length;

  // Dummy Werte für Zeitkonto und Saldo
  const zeitkonto=0;
  const saldo=workHours-(settings.wochenstunden*4);

  const content=document.getElementById('content');
  content.innerHTML=`
    <div class="month-nav">
      <div class="nav-btns">
        <button class="nav-btn" onclick="prevMonth()">‹ Zurück</button>
      </div>
      <h2>${monthNames[currentMonth-1]} ${currentYear} <span class="live-badge">LIVE</span></h2>
      <div class="nav-btns">
        <button class="nav-btn" onclick="nextMonth()">Weiter ›</button>
      </div>
    </div>

    <div id="stats">
      <div class="sc">
        <div class="sc-lbl">Zeitkonto</div>
        <div class="sc-val">${zeitkonto>=0?'+':''}${zeitkonto.toFixed(2)} h</div>
        <div class="sc-sub">+0,00 T</div>
      </div>
      <div class="sc">
        <div class="sc-lbl">Zeitausgleich</div>
        <div class="sc-val">${zaDays>0?'-':''}${(zaDays*settings.wochenstunden/5).toFixed(2)} h</div>
      </div>
      <div class="sc">
        <div class="sc-lbl">Krank</div>
        <div class="sc-val">${krankDays}</div>
      </div>
      <div class="sc">
        <div class="sc-lbl">Gesamt</div>
        <div class="sc-val">${workHours.toFixed(1)} h</div>
      </div>
      <div class="sc">
        <div class="sc-lbl">Saldo</div>
        <div class="sc-val">${saldo>=0?'+':''}${saldo.toFixed(2)} h</div>
      </div>
    </div>

    <div id="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:40px;">Tag</th>
            <th style="width:50px;">M/T</th>
            <th>Von</th>
            <th>Bis</th>
            <th style="width:70px;">Pause</th>
            <th>Bemerkung</th>
            <th style="width:80px;">Netto</th>
          </tr>
        </thead>
        <tbody>
          ${generateCalendarRows(currentYear,currentMonth,entries,settings)}
        </tbody>
      </table>
    </div>
  `;
}

function generateCalendarRows(year,month,entries,settings){
  const daysInMonth=new Date(year,month,0).getDate();
  let html='';
  let lastKW=null;

  for(let day=1;day<=daysInMonth;day++){
    const dateStr=`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const date=new Date(dateStr);
    const dayName=getDayName(dateStr);
    const kw=getWeekNumber(dateStr);
    const entry=entries.find(e=>e.date===dateStr);

    // Zeilen-Klasse für Wochenende
    let rowClass='';
    if(dayName==='Sa')rowClass='wk-sa';
    if(dayName==='So')rowClass='wk-so';

    // Typ und Werte
    let von='—',bis='—',pause='—',bemerkung='—',netto='—';
    let vonDisplay='';

    if(entry){
      if(entry.type==='urlaub'){
        vonDisplay='<span class="type-urlaub">Urlaub</span>';
        bemerkung=entry.bemerkung||'—';
      }else if(entry.type==='zeitausgleich'){
        vonDisplay='<span class="type-za">Zeitausgleich</span>';
        bemerkung=entry.bemerkung||'—';
      }else if(entry.type==='krank'){
        vonDisplay='<span class="type-krank">Krank</span>';
        bemerkung=entry.bemerkung||'—';
      }else if(entry.type==='normal'){
        von=entry.von||'—';
        bis=entry.bis||'—';
        pause=entry.pause>0?entry.pause+' Min':'—';
        bemerkung=entry.bemerkung||'—';

        if(entry.von&&entry.bis){
          const h1=parseInt(entry.von.split(':')[0])*60+parseInt(entry.von.split(':')[1]);
          const h2=parseInt(entry.bis.split(':')[0])*60+parseInt(entry.bis.split(':')[1]);
          const nettoMin=h2-h1-entry.pause;
          netto=`${Math.floor(nettoMin/60)},${String(Math.floor((nettoMin%60)/6)).padStart(1,'0')}0 h`;
        }
      }

      // Feiertage erkennen
      if(bemerkung.includes('Himmelfahrt')||bemerkung.includes('Pfingst')||bemerkung.includes('Weihnacht')||bemerkung.includes('Neujahr')){
        rowClass='holiday';
        vonDisplay=`<span class="type-holiday">${bemerkung}</span>`;
        bemerkung='—';
      }
    }

    // KW Badge für Montag
    let kwBadge='';
    if(dayName==='Mo'&&kw!==lastKW){
      kwBadge=`<span class="kw-badge">KW ${kw}</span>`;
      lastKW=kw;
    }

    html+=`<tr class="${rowClass}">
      <td class="td-tag">${day}</td>
      <td class="td-wt">${dayName}${kwBadge}</td>
      <td class="td-von">${vonDisplay||von}</td>
      <td class="td-time">${vonDisplay?'':bis}</td>
      <td class="td-time">${pause}</td>
      <td class="td-bem">${bemerkung}</td>
      <td class="td-netto">${netto}</td>
    </tr>`;
  }

  return html||'<tr><td colspan="7" class="empty">Keine Einträge</td></tr>';
}

function prevMonth(){
  currentMonth--;
  if(currentMonth<1){
    currentMonth=12;
    currentYear--;
  }
  loadEmployeeData();
}

function nextMonth(){
  currentMonth++;
  if(currentMonth>12){
    currentMonth=1;
    currentYear++;
  }
  loadEmployeeData();
}

function toggleDarkMode(){
  darkMode=!darkMode;
  document.body.classList.toggle('dark',darkMode);
  localStorage.setItem('superAdminDarkMode',darkMode);
  updateDarkModeButton();
}

function updateDarkModeButton(){
  const btn=document.getElementById('darkModeBtn');
  if(btn){
    btn.textContent=darkMode?'☀️':'🌙';
  }
}

async function logout(){
  await fetch('/api/super-admin/logout',{method:'POST'});
  window.location.href='/';
}

// Init
loadEmployees();
if(localStorage.getItem('superAdminDarkMode')==='true'){
  darkMode=true;
  document.body.classList.add('dark');
}else{
  darkMode=false;
  document.body.classList.remove('dark');
}
updateDarkModeButton();
</script>

</body>
</html>
