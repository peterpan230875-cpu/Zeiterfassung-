<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Super-Admin Portal — Zeiterfassung v2.8</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

/* ── TOKENS ─────────────────────────────────────────────────────────────── */
:root {
  --bg:#F0EDE8; --bg2:#E8E4DE;
  --sur:#FFFFFF; --sur2:#FAFAF8;
  --brd:#DDD8CF;
  --txt:#18160F; --txt2:#6B6560; --muted:#A09890;
  --blue:#2563EB; --blue-s:#3B82F6; --blue-bg:#EFF6FF; --blue-m:#BFDBFE;
  --green:#16A34A; --green-bg:#F0FDF4; --green-m:#BBF7D0;
  --red:#DC2626; --red-bg:#FEF2F2; --red-m:#FECACA;
  --amber:#D97706; --amber-bg:#FEF3C7; --amber-m:#FDE68A;
  --r:12px; --rs:8px;
  --sh-sm:0 1px 3px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --sh:0 2px 8px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);
}
body.dark {
  --bg:#111113; --bg2:#1C1C1F;
  --sur:#1C1C1E; --sur2:#242428;
  --brd:#2C2C30;
  --txt:#F5F5F7; --txt2:#A1A1A8; --muted:#6E6E75;
  --blue:#3B82F6; --blue-s:#60A5FA; --blue-bg:#1A2640; --blue-m:#1E3860;
  --green:#34D399; --green-bg:#0C2318; --green-m:#134530;
  --red:#F87171; --red-bg:#2A1010; --red-m:#4A1A1A;
  --amber:#FCD34D; --amber-bg:#2A1E05; --amber-m:#4A360A;
}

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Figtree',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:15px;-webkit-font-smoothing:antialiased;margin:0;padding:0;}

/* ── HEADER ─────────────────────────────────────────────────────────────── */
#hdr{
  position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--brd);
  box-shadow:var(--sh-sm);
}
body.dark #hdr{background:rgba(28,28,30,.94);}
#hdr-top{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;
}
#app-title{
  font-size:18px;font-weight:800;letter-spacing:-.5px;
  display:flex;align-items:center;gap:7px;
}
#app-title::before{
  content:'';width:8px;height:8px;border-radius:50%;
  background:#8B5CF6;box-shadow:0 0 0 3px rgba(139,92,246,.15);
}
.badge{
  font-size:9px;color:var(--muted);font-family:'JetBrains Mono',monospace;
  background:var(--bg2);border:1px solid var(--brd);border-radius:var(--rs);
  padding:3px 8px;font-weight:600;letter-spacing:.5px;
}
#hdr-spacer{flex:1;}
#hdr-btns{display:flex;gap:6px;align-items:center;}
.hbtn{
  padding:6px 10px;border-radius:var(--rs);border:1px solid var(--brd);
  background:var(--sur2);font-family:'Figtree',sans-serif;
  font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;gap:4px;color:var(--txt2);
}
.hbtn:hover{background:var(--bg2);color:var(--txt);}
.hbtn-red{background:var(--red-bg);color:var(--red);border-color:var(--red-m);}
.hbtn-red:hover{background:var(--red-m);}

/* ── CONTAINER ──────────────────────────────────────────────────────────── */
.container{display:flex;height:calc(100vh - 52px);}

/* ── SIDEBAR ────────────────────────────────────────────────────────────── */
.sidebar{
  width:280px;background:var(--sur);border-right:1px solid var(--brd);
  overflow-y:auto;padding:16px 12px;
}
.sidebar h2{
  font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;color:var(--muted);margin-bottom:12px;padding:0 8px;
}
.employee-list{list-style:none;}
.employee-item{
  padding:10px 12px;background:var(--sur2);border:1px solid var(--brd);
  border-radius:var(--rs);margin-bottom:6px;cursor:pointer;transition:all .15s;
}
.employee-item:hover{background:var(--bg2);border-color:var(--blue-m);}
.employee-item.active{
  background:var(--blue-bg);border-color:var(--blue);
  box-shadow:0 0 0 2px rgba(37,99,235,.1);
}
.employee-name{font-weight:600;color:var(--txt);font-size:14px;}
.employee-user{
  font-size:11px;color:var(--muted);margin-top:3px;
  font-family:'JetBrains Mono',monospace;
}

/* ── MAIN ───────────────────────────────────────────────────────────────── */
.main{flex:1;padding:16px;overflow-y:auto;max-width:1100px;margin:0 auto;width:100%;}

/* Info Notice */
.info-banner{
  background:var(--amber-bg);border:1px solid var(--amber-m);
  border-radius:var(--r);padding:12px 14px;margin-bottom:16px;
  font-size:13px;color:#92400e;display:flex;align-items:flex-start;gap:8px;
}
body.dark .info-banner{color:var(--amber);}
.info-banner strong{font-weight:700;}

/* Month Nav */
.month-nav{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--sur);border:1px solid var(--brd);
  border-radius:var(--r);padding:12px 16px;margin-bottom:16px;
  box-shadow:var(--sh-sm);
}
.month-nav h2{
  font-size:16px;font-weight:700;color:var(--txt);
  display:flex;align-items:center;gap:8px;
}
.live-badge{
  display:inline-block;background:var(--green);color:#fff;
  padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;
  letter-spacing:.5px;animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.7;}}
.nav-btns{display:flex;gap:6px;}
.nav-btn{
  padding:6px 12px;border-radius:var(--rs);border:1px solid var(--brd);
  background:var(--sur2);cursor:pointer;font-weight:600;font-size:13px;
  color:var(--txt2);transition:all .15s;font-family:'Figtree',sans-serif;
}
.nav-btn:hover{background:var(--bg2);color:var(--txt);}

/* ── STATS ──────────────────────────────────────────────────────────────── */
#stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:10px;margin-bottom:16px;
}
.sc{
  background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);
  padding:10px 12px;box-shadow:var(--sh-sm);position:relative;overflow:hidden;
}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.sc:nth-child(1)::before{background:var(--blue);}
.sc:nth-child(2)::before{background:var(--green);}
.sc:nth-child(3)::before{background:#F59E0B;}
.sc:nth-child(4)::before{background:var(--green);}
.sc:nth-child(5)::before{background:var(--red);}
.sc:nth-child(6)::before{background:#8B5CF6;}
.sc-lbl{
  font-size:9px;color:var(--muted);font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;
}
.sc-val{
  font-family:'JetBrains Mono',monospace;font-size:16px;
  font-weight:600;color:var(--txt);line-height:1.2;
}

/* ── TABLE ──────────────────────────────────────────────────────────────── */
#tbl-wrap{
  background:var(--sur);border:1px solid var(--brd);
  border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);
}
table{width:100%;border-collapse:collapse;}
thead tr{background:var(--bg2);border-bottom:1px solid var(--brd);}
thead th{
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;color:var(--muted);padding:10px 12px;text-align:left;
}
tbody td{
  padding:11px 12px;font-size:13px;border-bottom:1px solid var(--brd);
  color:var(--txt);font-family:'Figtree',sans-serif;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--bg2);}
.td-date{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--txt2);}
.td-type{font-weight:600;font-size:12px;}
.td-time{font-family:'JetBrains Mono',monospace;font-size:12px;}
.td-netto{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:12px;}
.type-za{color:var(--green);}
.type-urlaub{color:#F59E0B;}
.type-krank{color:var(--red);}

.empty{
  text-align:center;padding:60px 20px;color:var(--muted);font-size:15px;
}
</style>
</head>
<body>

<!-- Header -->
<div id="hdr">
  <div id="hdr-top">
    <div id="app-title">
      🔐 Super-Admin Portal
      <span class="badge">READ-ONLY</span>
    </div>
    <div id="hdr-spacer"></div>
    <div id="hdr-btns">
      <button class="hbtn" onclick="toggleDarkMode()">🌙</button>
      <button class="hbtn hbtn-red" onclick="logout()">🚪 Abmelden</button>
    </div>
  </div>
</div>

<!-- Container -->
<div class="container">
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>👥 Mitarbeiter</h2>
    <ul id="employeeList" class="employee-list"></ul>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="info-banner">
      <span>ℹ️</span>
      <div>
        <strong>Hinweis:</strong> Du hast vollständigen Lesezugriff auf alle Daten. Änderungen sind nicht möglich. Alle Daten werden live angezeigt, unabhängig vom Abschlussstatus.
      </div>
    </div>

    <div id="content">
      <div class="empty">👈 Wähle einen Mitarbeiter aus der Liste</div>
    </div>
  </div>
</div>

<script>
let employees=[];
let selectedUserId=null;
let currentYear=new Date().getFullYear();
let currentMonth=new Date().getMonth()+1;
let darkMode=false;

async function loadEmployees(){
  try{
    const res=await fetch('/api/super-admin/all-users');
    if(!res.ok){
      if(res.status===401)window.location.href='/';
      return;
    }
    employees=await res.json();
    renderEmployeeList();
  }catch(ex){
    console.error('Fehler beim Laden der Mitarbeiter:',ex);
  }
}

function renderEmployeeList(){
  const list=document.getElementById('employeeList');
  list.innerHTML=employees.map(emp=>`
    <li class="employee-item ${selectedUserId===emp.id?'active':''}" onclick="selectEmployee('${emp.id}')">
      <div class="employee-name">${emp.name}</div>
      <div class="employee-user">@${emp.username}</div>
    </li>
  `).join('');
}

async function selectEmployee(userId){
  selectedUserId=userId;
  renderEmployeeList();
  await loadEmployeeData();
}

async function loadEmployeeData(){
  if(!selectedUserId)return;

  const emp=employees.find(e=>e.id===selectedUserId);
  if(!emp)return;

  try{
    const [entriesRes,settingsRes]=await Promise.all([
      fetch(`/api/super-admin/entries/${selectedUserId}?year=${currentYear}&month=${currentMonth}`),
      fetch(`/api/super-admin/settings/${selectedUserId}`)
    ]);

    if(!entriesRes.ok||!settingsRes.ok){
      document.getElementById('content').innerHTML='<div class="empty">Fehler beim Laden der Daten</div>';
      return;
    }

    const entries=await entriesRes.json();
    const settings=await settingsRes.json();

    renderEmployeeData(emp,entries,settings);
  }catch(ex){
    console.error('Fehler:',ex);
  }
}

function renderEmployeeData(emp,entries,settings){
  const monthNames=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

  // Berechne Statistiken
  let workHours=0;
  entries.forEach(e=>{
    if(e.type==='normal'&&e.von&&e.bis){
      const h1=parseInt(e.von.split(':')[0])*60+parseInt(e.von.split(':')[1]);
      const h2=parseInt(e.bis.split(':')[0])*60+parseInt(e.bis.split(':')[1]);
      workHours+=(h2-h1-e.pause)/60;
    }
  });

  const urlaubDays=entries.filter(e=>e.type==='urlaub').length;
  const zaDays=entries.filter(e=>e.type==='zeitausgleich').length;
  const krankDays=entries.filter(e=>e.type==='krank').length;

  const content=document.getElementById('content');
  content.innerHTML=`
    <div class="month-nav">
      <div class="nav-btns">
        <button class="nav-btn" onclick="prevMonth()">‹ Zurück</button>
      </div>
      <h2>${monthNames[currentMonth-1]} ${currentYear} <span class="live-badge">LIVE</span></h2>
      <div class="nav-btns">
        <button class="nav-btn" onclick="nextMonth()">Weiter ›</button>
      </div>
    </div>

    <div id="stats">
      <div class="sc">
        <div class="sc-lbl">👤 Mitarbeiter</div>
        <div class="sc-val">${emp.name}</div>
      </div>
      <div class="sc">
        <div class="sc-lbl">⏱️ Gesamt (Stunden)</div>
        <div class="sc-val">${workHours.toFixed(1)} h</div>
      </div>
      <div class="sc">
        <div class="sc-lbl">🏖️ Urlaub (Tage)</div>
        <div class="sc-val">${urlaubDays}</div>
      </div>
      <div class="sc">
        <div class="sc-lbl">⚖️ Zeitausgleich (Tage)</div>
        <div class="sc-val">${zaDays}</div>
      </div>
      <div class="sc">
        <div class="sc-lbl">🤒 Krank (Tage)</div>
        <div class="sc-val">${krankDays}</div>
      </div>
      <div class="sc">
        <div class="sc-lbl">📋 Wochenstunden</div>
        <div class="sc-val">${settings.wochenstunden} h</div>
      </div>
    </div>

    <div id="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>Datum</th>
            <th>Typ</th>
            <th>Von</th>
            <th>Bis</th>
            <th>Pause</th>
            <th>Netto</th>
            <th>Bemerkung</th>
          </tr>
        </thead>
        <tbody>
          ${entries.length===0?'<tr><td colspan="7" class="empty">Keine Einträge für diesen Monat</td></tr>':
            entries.map(e=>{
              let netto='—';
              if(e.type==='normal'&&e.von&&e.bis){
                const h1=parseInt(e.von.split(':')[0])*60+parseInt(e.von.split(':')[1]);
                const h2=parseInt(e.bis.split(':')[0])*60+parseInt(e.bis.split(':')[1]);
                const nettoMin=h2-h1-e.pause;
                netto=`${Math.floor(nettoMin/60)}:${String(nettoMin%60).padStart(2,'0')} h`;
              }

              const typeMap={
                'normal':'Arbeit',
                'urlaub':'Urlaub',
                'zeitausgleich':'ZA',
                'krank':'Krank'
              };
              const typeClass={
                'zeitausgleich':'type-za',
                'urlaub':'type-urlaub',
                'krank':'type-krank'
              }[e.type]||'';

              return`<tr>
                <td class="td-date">${e.date}</td>
                <td class="td-type ${typeClass}">${typeMap[e.type]||e.type}</td>
                <td class="td-time">${e.von||'—'}</td>
                <td class="td-time">${e.bis||'—'}</td>
                <td class="td-time">${e.pause>0?e.pause+' Min':'—'}</td>
                <td class="td-netto">${netto}</td>
                <td>${e.bemerkung||'—'}</td>
              </tr>`;
            }).join('')
          }
        </tbody>
      </table>
    </div>
  `;
}

function prevMonth(){
  currentMonth--;
  if(currentMonth<1){
    currentMonth=12;
    currentYear--;
  }
  loadEmployeeData();
}

function nextMonth(){
  currentMonth++;
  if(currentMonth>12){
    currentMonth=1;
    currentYear++;
  }
  loadEmployeeData();
}

function toggleDarkMode(){
  darkMode=!darkMode;
  document.body.classList.toggle('dark',darkMode);
  localStorage.setItem('superAdminDarkMode',darkMode);
}

async function logout(){
  await fetch('/api/super-admin/logout',{method:'POST'});
  window.location.href='/';
}

// Init
loadEmployees();
if(localStorage.getItem('superAdminDarkMode')==='true'){
  darkMode=true;
  document.body.classList.add('dark');
}
</script>

</body>
</html>
