<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Super-Admin Portal — Zeiterfassung</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:system-ui,-apple-system,sans-serif;background:#f3f4f6;color:#111827;margin:0;padding:0;}
.header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.1);}
.header h1{font-size:24px;font-weight:700;}
.badge{display:inline-block;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700;margin-left:10px;letter-spacing:.5px;}
.header-btns{display:flex;gap:12px;}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:14px;transition:all .2s;}
.btn-light{background:rgba(255,255,255,.2);color:#fff;}
.btn-light:hover{background:rgba(255,255,255,.3);}
.btn-logout{background:#dc2626;color:#fff;}
.btn-logout:hover{background:#b91c1c;}
.container{display:flex;height:calc(100vh - 64px);}
.sidebar{width:320px;background:#fff;border-right:1px solid #e5e7eb;overflow-y:auto;padding:20px;}
.sidebar h2{font-size:18px;margin-bottom:16px;color:#374151;}
.employee-list{list-style:none;}
.employee-item{padding:12px;background:#f9fafb;border:2px solid #e5e7eb;border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .2s;}
.employee-item:hover{background:#f3f4f6;border-color:#667eea;}
.employee-item.active{background:#ede9fe;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.1);}
.employee-name{font-weight:600;color:#111827;font-size:15px;}
.employee-user{font-size:13px;color:#6b7280;margin-top:4px;}
.main{flex:1;padding:24px;overflow-y:auto;}
.month-nav{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:16px 20px;border-radius:12px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.month-nav h2{font-size:20px;font-weight:700;color:#111827;}
.nav-btns{display:flex;gap:12px;}
.nav-btn{padding:8px 16px;background:#667eea;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:background .2s;}
.nav-btn:hover{background:#5a67d8;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:20px;}
.stat-box{background:#fff;padding:16px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.stat-label{font-size:13px;color:#6b7280;margin-bottom:4px;font-weight:600;}
.stat-value{font-size:24px;font-weight:700;color:#111827;}
.stat-value.positive{color:#16a34a;}
.stat-value.negative{color:#dc2626;}
.entries-table{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.1);}
table{width:100%;border-collapse:collapse;}
thead{background:#f9fafb;}
th{text-align:left;padding:12px 16px;font-size:13px;font-weight:700;color:#374151;border-bottom:2px solid #e5e7eb;}
td{padding:12px 16px;font-size:14px;border-bottom:1px solid #f3f4f6;}
tbody tr:hover{background:#f9fafb;}
.empty{text-align:center;padding:40px;color:#9ca3af;font-size:16px;}
.live-badge{display:inline-block;background:#10b981;color:#fff;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;margin-left:8px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.7;}}
.readonly-notice{background:#fef3c7;border-left:4px solid #f59e0b;padding:12px 16px;border-radius:8px;margin-bottom:20px;font-size:14px;color:#92400e;}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🔐 Super-Admin Portal <span class="badge">READ-ONLY</span></h1>
  </div>
  <div class="header-btns">
    <button class="btn btn-light" onclick="toggleDarkMode()">🌙</button>
    <button class="btn btn-logout" onclick="logout()">🚪 Abmelden</button>
  </div>
</div>

<div class="container">
  <div class="sidebar">
    <h2>👥 Alle Mitarbeiter</h2>
    <ul id="employeeList" class="employee-list"></ul>
  </div>

  <div class="main">
    <div class="readonly-notice">
      <strong>ℹ️ Hinweis:</strong> Du hast vollständigen Lesezugriff auf alle Daten. Änderungen sind nicht möglich. Alle Daten werden live angezeigt, unabhängig vom Abschlussstatus.
    </div>

    <div id="content">
      <div class="empty">👈 Wähle einen Mitarbeiter aus der Liste</div>
    </div>
  </div>
</div>

<script>
let employees=[];
let selectedUserId=null;
let currentYear=new Date().getFullYear();
let currentMonth=new Date().getMonth()+1;

async function loadEmployees(){
  try{
    const res=await fetch('/api/super-admin/all-users');
    if(!res.ok){
      if(res.status===401)window.location.href='/super-admin-login';
      return;
    }
    employees=await res.json();
    renderEmployeeList();
  }catch(ex){
    console.error('Fehler beim Laden der Mitarbeiter:',ex);
  }
}

function renderEmployeeList(){
  const list=document.getElementById('employeeList');
  list.innerHTML=employees.map(emp=>`
    <li class="employee-item ${selectedUserId===emp.id?'active':''}" onclick="selectEmployee('${emp.id}')">
      <div class="employee-name">${emp.name}</div>
      <div class="employee-user">@${emp.username}</div>
    </li>
  `).join('');
}

async function selectEmployee(userId){
  selectedUserId=userId;
  renderEmployeeList();
  await loadEmployeeData();
}

async function loadEmployeeData(){
  if(!selectedUserId)return;

  const emp=employees.find(e=>e.id===selectedUserId);
  if(!emp)return;

  try{
    const [entriesRes,settingsRes]=await Promise.all([
      fetch(`/api/super-admin/entries/${selectedUserId}?year=${currentYear}&month=${currentMonth}`),
      fetch(`/api/super-admin/settings/${selectedUserId}`)
    ]);

    if(!entriesRes.ok||!settingsRes.ok){
      document.getElementById('content').innerHTML='<div class="empty">Fehler beim Laden der Daten</div>';
      return;
    }

    const entries=await entriesRes.json();
    const settings=await settingsRes.json();

    renderEmployeeData(emp,entries,settings);
  }catch(ex){
    console.error('Fehler:',ex);
  }
}

function renderEmployeeData(emp,entries,settings){
  const monthNames=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

  // Berechne Statistiken (vereinfacht)
  const workHours=entries.filter(e=>e.type==='normal').reduce((sum,e)=>{
    if(!e.von||!e.bis)return sum;
    const h1=parseInt(e.von.split(':')[0])*60+parseInt(e.von.split(':')[1]);
    const h2=parseInt(e.bis.split(':')[0])*60+parseInt(e.bis.split(':')[1]);
    return sum+(h2-h1-e.pause)/60;
  },0);

  const urlaubDays=entries.filter(e=>e.type==='urlaub').length;
  const zaDays=entries.filter(e=>e.type==='zeitausgleich').length;
  const krankDays=entries.filter(e=>e.type==='krank').length;

  const content=document.getElementById('content');
  content.innerHTML=`
    <div class="month-nav">
      <div class="nav-btns">
        <button class="nav-btn" onclick="prevMonth()">‹ Zurück</button>
      </div>
      <h2>${monthNames[currentMonth-1]} ${currentYear} <span class="live-badge">LIVE</span></h2>
      <div class="nav-btns">
        <button class="nav-btn" onclick="nextMonth()">Weiter ›</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-box">
        <div class="stat-label">👤 Mitarbeiter</div>
        <div class="stat-value">${emp.name}</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">⏱️ Gesamt (Stunden)</div>
        <div class="stat-value">${workHours.toFixed(1)} h</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">🏖️ Urlaub (Tage)</div>
        <div class="stat-value">${urlaubDays}</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">⚖️ Zeitausgleich (Tage)</div>
        <div class="stat-value">${zaDays}</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">🤒 Krank (Tage)</div>
        <div class="stat-value">${krankDays}</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">📋 Wochenstunden</div>
        <div class="stat-value">${settings.wochenstunden} h</div>
      </div>
    </div>

    <div class="entries-table">
      <table>
        <thead>
          <tr>
            <th>Datum</th>
            <th>Typ</th>
            <th>Von</th>
            <th>Bis</th>
            <th>Pause</th>
            <th>Netto</th>
            <th>Bemerkung</th>
          </tr>
        </thead>
        <tbody>
          ${entries.length===0?'<tr><td colspan="7" class="empty">Keine Einträge für diesen Monat</td></tr>':
            entries.map(e=>{
              let netto='—';
              if(e.type==='normal'&&e.von&&e.bis){
                const h1=parseInt(e.von.split(':')[0])*60+parseInt(e.von.split(':')[1]);
                const h2=parseInt(e.bis.split(':')[0])*60+parseInt(e.bis.split(':')[1]);
                const nettoMin=h2-h1-e.pause;
                netto=`${Math.floor(nettoMin/60)}:${String(nettoMin%60).padStart(2,'0')} h`;
              }

              const typeLabel={
                'normal':'Arbeit',
                'urlaub':'Urlaub',
                'zeitausgleich':'ZA',
                'krank':'Krank'
              }[e.type]||e.type;

              return`<tr>
                <td>${e.date}</td>
                <td>${typeLabel}</td>
                <td>${e.von||'—'}</td>
                <td>${e.bis||'—'}</td>
                <td>${e.pause>0?e.pause+' Min':'—'}</td>
                <td>${netto}</td>
                <td>${e.bemerkung||'—'}</td>
              </tr>`;
            }).join('')
          }
        </tbody>
      </table>
    </div>
  `;
}

function prevMonth(){
  currentMonth--;
  if(currentMonth<1){
    currentMonth=12;
    currentYear--;
  }
  loadEmployeeData();
}

function nextMonth(){
  currentMonth++;
  if(currentMonth>12){
    currentMonth=1;
    currentYear++;
  }
  loadEmployeeData();
}

function toggleDarkMode(){
  alert('Dunkelmodus wird in einer zukünftigen Version implementiert.');
}

async function logout(){
  await fetch('/api/super-admin/logout',{method:'POST'});
  window.location.href='/super-admin-login';
}

// Initial load
loadEmployees();
</script>

</body>
</html>
