<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeiterfassung - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Figtree', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 40px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo p {
      color: #999;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 20px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #333;
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background: #e9e9e9;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .message.error {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
      display: block;
    }

    .message.success {
      background: #efe;
      color: #3c3;
      border: 1px solid #cfc;
      display: block;
    }

    .toggle-text {
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-top: 20px;
    }

    .toggle-text a {
      color: #667eea;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
    }

    .toggle-text a:hover {
      text-decoration: underline;
    }

    .loading {
      display: none;
      text-align: center;
      color: #667eea;
      font-size: 14px;
      margin-top: 20px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ddd;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <h1>⏱ Zeiterfassung</h1>
        <p>Deine Arbeitszeiten im Blick</p>
      </div>

      <div id="message" class="message"></div>

      <!-- Login Form -->
      <div id="loginForm">
        <div class="form-group">
          <label>Benutzername</label>
          <input type="text" id="loginUsername" placeholder="z.B. max_mueller" autocomplete="username">
        </div>
        <div class="form-group">
          <label>Passwort</label>
          <input type="password" id="loginPassword" placeholder="Dein sicheres Passwort" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" onclick="handleLogin()">Anmelden</button>
        <div class="toggle-text">
          Noch kein Konto? <a onclick="toggleForm()">Jetzt registrieren</a>
        </div>
      </div>

      <!-- Register Form -->
      <div id="registerForm" style="display: none;">
        <div class="form-group">
          <label>Vollständiger Name</label>
          <input type="text" id="registerName" placeholder="z.B. Max Müller" autocomplete="name">
        </div>
        <div class="form-group">
          <label>Benutzername</label>
          <input type="text" id="registerUsername" placeholder="z.B. max_mueller" autocomplete="username">
        </div>
        <div class="form-group">
          <label>Passwort</label>
          <input type="password" id="registerPassword" placeholder="Mindestens 6 Zeichen" autocomplete="new-password">
          <small style="font-size:12px;color:#999;margin-top:4px;display:block;">Mindestens 6 Zeichen</small>
        </div>
        <div class="form-group">
          <label>Passwort bestätigen</label>
          <input type="password" id="registerPasswordConfirm" placeholder="Passwort wiederholen" autocomplete="new-password">
        </div>
        <button class="btn btn-primary" onclick="handleRegister()">Konto erstellen</button>
        <div class="toggle-text">
          Bereits Mitglied? <a onclick="toggleForm()">Jetzt anmelden</a>
        </div>
      </div>

      <div class="loading" id="loading">
        <span class="spinner"></span>
        <span>Wird verarbeitet...</span>
      </div>

      <div style="text-align:center;margin-top:30px;padding-top:20px;border-top:1px solid #eee;">
        <a href="/admin-login" style="color:#999;font-size:13px;text-decoration:none;font-weight:500;">🔒 Admin-Login</a>
        <div style="margin-top:12px;font-size:9px;color:#ccc;font-weight:400;">
          Entwickelt von S.Michlenz
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleForm() {
      document.getElementById('loginForm').style.display =
        document.getElementById('loginForm').style.display === 'none' ? 'block' : 'none';
      document.getElementById('registerForm').style.display =
        document.getElementById('registerForm').style.display === 'none' ? 'block' : 'none';
      document.getElementById('message').style.display = 'none';
    }

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = `message ${type}`;
    }

    function setLoading(show) {
      document.getElementById('loading').style.display = show ? 'block' : 'none';
    }

    async function handleLogin() {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!username || !password) {
        showMessage('Bitte alle Felder ausfüllen', 'error');
        return;
      }

      setLoading(true);
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok) {
          showMessage('Login erfolgreich! Wird weitergeleitet...', 'success');
          const redirectUrl = data.isSuperAdmin ? '/super-admin'
                            : data.isAdmin ? '/admin'
                            : '/app';
          setTimeout(() => window.location.href = redirectUrl, 1500);
        } else {
          showMessage(data.error || 'Login fehlgeschlagen', 'error');
        }
      } catch (err) {
        showMessage('Fehler beim Login: ' + err.message, 'error');
      } finally {
        setLoading(false);
      }
    }

    async function handleRegister() {
      const name = document.getElementById('registerName').value.trim();
      const username = document.getElementById('registerUsername').value.trim();
      const password = document.getElementById('registerPassword').value;
      const passwordConfirm = document.getElementById('registerPasswordConfirm').value;

      if (!name || !username || !password || !passwordConfirm) {
        showMessage('Bitte alle Felder ausfüllen', 'error');
        return;
      }

      if (password.length < 6) {
        showMessage('Passwort muss mindestens 6 Zeichen lang sein', 'error');
        return;
      }

      if (password !== passwordConfirm) {
        showMessage('Passwörter stimmen nicht überein', 'error');
        return;
      }

      setLoading(true);
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, name })
        });

        const data = await res.json();

        if (res.ok) {
          showMessage('Registrierung erfolgreich! Melden Sie sich an.', 'success');
          setTimeout(() => toggleForm(), 1500);
          document.getElementById('loginUsername').value = username;
          document.getElementById('loginPassword').value = '';
        } else {
          showMessage(data.error || 'Registrierung fehlgeschlagen', 'error');
        }
      } catch (err) {
        showMessage('Fehler bei der Registrierung: ' + err.message, 'error');
      } finally {
        setLoading(false);
      }
    }

    // Enter-Taste unterstützen
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        if (document.getElementById('loginForm').style.display !== 'none') {
          handleLogin();
        } else {
          handleRegister();
        }
      }
    });
  </script>
</body>
</html>
