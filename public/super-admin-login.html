<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Super-Admin Login — Zeiterfassung</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:420px;padding:40px;}
h1{font-size:28px;font-weight:700;color:#1f2937;margin-bottom:8px;text-align:center;}
.subtitle{text-align:center;color:#6b7280;font-size:14px;margin-bottom:32px;}
.badge{display:inline-block;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:4px 12px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.5px;margin-left:8px;}
.input-group{margin-bottom:20px;}
label{display:block;font-weight:600;color:#374151;margin-bottom:8px;font-size:14px;}
input{width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:8px;font-size:15px;transition:all .2s;}
input:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.1);}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s;}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(102,126,234,.3);}
.btn:active{transform:translateY(0);}
.error{background:#fee;border-left:4px solid #dc2626;padding:12px;border-radius:6px;color:#dc2626;font-size:14px;margin-bottom:20px;display:none;}
.footer{text-align:center;margin-top:24px;padding-top:24px;border-top:1px solid #e5e7eb;font-size:12px;color:#9ca3af;}
.back-link{display:block;text-align:center;margin-top:20px;color:#667eea;text-decoration:none;font-size:14px;font-weight:500;}
.back-link:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="card">
  <h1>🔐 Super-Admin <span class="badge">LIVE VIEW</span></h1>
  <div class="subtitle">Vollständiger Lesezugriff auf alle Daten</div>

  <div id="error" class="error"></div>

  <form id="loginForm">
    <div class="input-group">
      <label for="username">🔑 Benutzername</label>
      <input type="text" id="username" name="username" required autocomplete="username"/>
    </div>

    <div class="input-group">
      <label for="password">🔒 Passwort</label>
      <input type="password" id="password" name="password" required autocomplete="current-password"/>
    </div>

    <button type="submit" class="btn">🚀 Anmelden</button>
  </form>

  <a href="/admin-login" class="back-link">← Zurück zum normalen Admin-Login</a>

  <div class="footer">
    Zeiterfassung v3.0 · Super-Admin Portal<br>
    Entwickelt von S.Michlenz
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const err=document.getElementById('error');
  err.style.display='none';

  const username=document.getElementById('username').value;
  const password=document.getElementById('password').value;

  try{
    const res=await fetch('/api/super-admin/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username,password})
    });

    const data=await res.json();

    if(res.ok){
      window.location.href='/super-admin';
    }else{
      err.textContent=data.error||'Anmeldung fehlgeschlagen';
      err.style.display='block';
    }
  }catch(ex){
    err.textContent='Netzwerkfehler. Bitte versuche es erneut.';
    err.style.display='block';
  }
});
</script>
</body>
</html>
