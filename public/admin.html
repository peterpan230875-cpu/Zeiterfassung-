<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin · Zeiterfassung</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --bg:#F0EDE8;
  --sur:#FFFFFF;
  --sur2:#FAFAF8;
  --sur3:#E8E4DE;
  --brd:#DDD8CF;
  --txt:#18160F;
  --txt2:#6B6560;
  --muted:#A09890;
  --hol-bg:#E9D5FF;--hol-t:#6B21A8;
  --sun-bg:#FED7AA;--sun-t:#9A3412;
  --sat-bg:#FEF3C7;--sat-t:#B45309;
  --wt-wd:#16A34A;--wt-we:#DC2626;
  --u-bg:#DBEAFE; --u-t:#2563EB;
  --za-bg:#DCFCE7;--za-t:#14532D;
  --k-bg:#FEE2E2; --k-t:#991B1B;
}
body.dark{
  --bg:#0F0F11;
  --sur:#1C1C1E;
  --sur2:#242428;
  --sur3:#2C2C30;
  --brd:#2C2C30;
  --txt:#F5F5F7;
  --txt2:#A1A1A8;
  --muted:#6E6E75;
  --hol-bg:#2E1065;--hol-t:#D8B4FE;
  --sun-bg:#1F1A0C;--sun-t:#FBD38D;
  --sat-bg:#2A1E05;--sat-t:#FCD34D;
  --wt-wd:#4ADE80;--wt-we:#F87171;
  --u-bg:#1A2640; --u-t:#60A5FA;
  --za-bg:#0C2318;--za-t:#34D399;
  --k-bg:#2A1010; --k-t:#F87171;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Figtree',sans-serif;background:var(--bg);color:var(--txt);
  min-height:100vh;font-size:15px;-webkit-font-smoothing:antialiased;
  transition:background .2s,color .2s;
}
#hdr{
  position:sticky;top:0;z-index:40;background:linear-gradient(135deg,#1F2937 0%,#111827 100%);
  color:#fff;padding:14px 20px;box-shadow:0 2px 8px rgba(0,0,0,.15);
  display:flex;align-items:center;gap:12px;
}
#hdr h1{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;}
#hdr .badge{background:rgba(220,38,38,.25);color:#FCA5A5;border:1px solid rgba(220,38,38,.4);
  padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.5px;}
#hdr .spacer{flex:1;}
.btn{
  padding:8px 14px;border:none;border-radius:8px;cursor:pointer;
  font-family:'Figtree',sans-serif;font-weight:600;font-size:13px;transition:all .15s;
}
.btn-logout{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);}
.btn-logout:hover{background:rgba(255,255,255,.2);}
.btn-theme{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);
  width:36px;height:36px;padding:0;font-size:16px;display:inline-flex;align-items:center;justify-content:center;}
.btn-theme:hover{background:rgba(255,255,255,.2);}

#main{display:grid;grid-template-columns:280px 1fr;gap:20px;padding:20px;max-width:1400px;margin:0 auto;}
@media(max-width:800px){#main{grid-template-columns:1fr;}}

.panel{background:var(--sur);border:1px solid var(--brd);border-radius:12px;padding:16px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);}
body.dark .panel{box-shadow:0 1px 3px rgba(0,0,0,.4);}
.panel h2{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  color:var(--txt2);margin-bottom:12px;}

#user-list{display:flex;flex-direction:column;gap:6px;}
.user-item{
  padding:12px 14px;border:1.5px solid var(--brd);border-radius:8px;cursor:pointer;
  transition:all .15s;background:var(--sur2);color:var(--txt);
}
.user-item:hover{border-color:var(--u-t);background:var(--u-bg);}
.user-item.active{border-color:var(--u-t);background:var(--u-bg);box-shadow:0 0 0 3px rgba(37,99,235,.18);}
.user-item .name{font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:6px;}
.user-item .username{font-size:12px;color:var(--txt2);font-family:'JetBrains Mono',monospace;}
.user-item .lock-ind{font-size:14px;line-height:1;flex-shrink:0;}

/* Status-Indikator: grün = abgeschlossen, rot = offen */
.user-item.month-closed{
  border-color:var(--za-t)!important;
  background:var(--za-bg)!important;
  box-shadow:0 0 0 2px rgba(22,163,74,.15);
}
.user-item.month-closed.active{
  box-shadow:0 0 0 3px rgba(22,163,74,.35);
}
.user-item.month-open{
  border-color:var(--k-t)!important;
  background:var(--k-bg)!important;
  box-shadow:0 0 0 2px rgba(220,38,38,.15);
}
.user-item.month-open.active{
  box-shadow:0 0 0 3px rgba(220,38,38,.35);
}

#month-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
#month-bar button{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--brd);
  background:var(--sur);color:var(--txt);cursor:pointer;font-size:16px;
}
#month-bar #month-lbl{
  font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;
  background:var(--sur3);border:1px solid var(--brd);border-radius:8px;
  padding:7px 14px;flex:1;text-align:center;color:var(--txt);
}

#stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px;}
.stat{background:var(--sur2);border:1px solid var(--brd);border-radius:8px;padding:10px;text-align:center;}
.stat .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;}
.stat .val{font-size:16px;font-weight:800;font-family:'JetBrains Mono',monospace;margin-top:3px;color:var(--txt);white-space:nowrap;}
.stat .val.blue{color:var(--u-t);}
.stat .val.amber{color:var(--sat-t);}
.stat .val.green{color:var(--za-t);}
.stat .val.red{color:var(--k-t);}

table{width:100%;border-collapse:collapse;font-size:13px;color:var(--txt);}
th{padding:8px 10px;text-align:left;font-size:11px;text-transform:uppercase;
  letter-spacing:.4px;color:var(--txt2);background:var(--sur2);border-bottom:1.5px solid var(--brd);}
td{padding:7px 10px;border-bottom:1px solid var(--brd);color:var(--txt);}
tr.r-hol{background:var(--hol-bg);}tr.r-hol td{color:var(--hol-t);}
tr.r-we{background:var(--sun-bg);} tr.r-we td{color:var(--sun-t);}
tr.r-sat{background:var(--sun-bg);}tr.r-sat td{color:var(--sun-t);}
.td-wt{color:var(--wt-wd);font-weight:600;}
tr.r-we .td-wt,tr.r-sat .td-wt{color:var(--wt-we)!important;}
tr.r-hol .td-wt{color:var(--hol-t)!important;}
tr.r-hol td:nth-of-type(6){font-size:15px!important;font-weight:700;text-align:center;}
tr.r-u{background:var(--u-bg);}
tr.r-za{background:var(--za-bg);}
tr.r-k{background:var(--k-bg);}
.mono{font-family:'JetBrains Mono',monospace;}
.empty{text-align:center;color:var(--muted);padding:40px;font-size:14px;}
.badge-typ{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;}
.b-u{background:var(--u-bg);color:var(--u-t);}
.b-za{background:var(--za-bg);color:var(--za-t);}
.b-k{background:var(--k-bg);color:var(--k-t);}
.b-hol{background:var(--hol-bg);color:var(--hol-t);}
.b-we{background:var(--sun-bg);color:var(--sun-t);}
.b-sat{background:var(--sun-bg);color:var(--sun-t);}
.b-inv{background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;margin-left:6px;}
body.dark .b-inv{background:#2A1E05;color:#FCD34D;border-color:#4A360A;}
.b-closed{background:#E5E7EB;color:#374151;border:1px solid #D1D5DB;}
body.dark .b-closed{background:#1F2937;color:#9CA3AF;border-color:#374151;}
tr.r-closed{background:#F3F4F6;}
body.dark tr.r-closed{background:#1F2937;}
.kw-badge{display:inline-block;font-size:10px;font-weight:700;color:var(--u-t);
  letter-spacing:.4px;margin-left:6px;background:var(--u-bg);border:1px solid var(--u-t);
  padding:1px 6px;border-radius:8px;line-height:1.4;vertical-align:middle;opacity:.85;}

/* Lock Status */
#lock-status{
  display:none;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;
  margin-bottom:14px;font-weight:700;font-size:14px;
}
#lock-status.locked{
  display:flex;background:var(--za-bg);border:1.5px solid var(--za-t);color:var(--za-t);
}
#lock-status .spacer{flex:1;}
.btn-release{
  padding:8px 14px;border:none;border-radius:8px;cursor:pointer;
  background:#DC2626;color:#fff;font-weight:700;font-size:13px;
  font-family:'Figtree',sans-serif;
}
.btn-release:hover{background:#B91C1C;}
.lock-info{font-size:12px;font-weight:500;opacity:.85;}

/* Locks-Liste rechts oben */
.user-item .lock-count{
  display:inline-block;margin-left:6px;padding:1px 6px;border-radius:8px;
  background:var(--za-bg);color:var(--za-t);font-size:10px;font-weight:700;
}

/* Sondertage */
.sd-row{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.sd-row input,.sd-row select{
  padding:9px 10px;border:1px solid var(--brd);border-radius:8px;
  background:var(--sur2);color:var(--txt);font-size:13px;font-family:'Figtree',sans-serif;
  width:100%;box-sizing:border-box;
}
.sd-add{
  padding:11px 14px;border:none;border-radius:8px;cursor:pointer;
  background:#2563EB;color:#fff;font-weight:700;font-size:14px;font-family:'Figtree',sans-serif;
  width:100%;margin-top:4px;
}
.sd-add:hover{background:#1D4ED8;}
.sd-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
.sd-item{
  display:flex;align-items:center;gap:6px;padding:8px 10px;
  border:1px solid var(--brd);border-radius:8px;background:var(--sur2);
  font-size:11px;flex-wrap:wrap;
}
.sd-item .sd-date{font-family:'JetBrains Mono',monospace;font-weight:700;flex-shrink:0;font-size:11px;}
.sd-item .sd-tag{padding:1px 6px;border-radius:10px;font-size:10px;font-weight:700;flex-shrink:0;}
.sd-item .sd-tag.inv{background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;}
.sd-item .sd-tag.cls{background:#E5E7EB;color:#374151;border:1px solid #D1D5DB;}
body.dark .sd-item .sd-tag.inv{background:#2A1E05;color:#FCD34D;border-color:#4A360A;}
body.dark .sd-item .sd-tag.cls{background:#1F2937;color:#9CA3AF;border-color:#374151;}
.sd-item .sd-lbl{flex:1;color:var(--txt2);min-width:0;font-size:11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sd-item .sd-del{
  padding:4px 8px;border:1px solid var(--brd);border-radius:6px;cursor:pointer;
  background:var(--sur);color:var(--k-t);font-size:11px;font-weight:700;flex-shrink:0;
  margin-left:auto;
}
</style>
</head>
<body>

<div id="hdr">
  <h1>🔒 Admin Portal</h1>
  <span class="badge">READ-ONLY</span>
  <span style="font-size:11px;color:rgba(255,255,255,.5);font-family:'JetBrains Mono',monospace;">v2.8</span>
  <span style="font-size:9px;color:rgba(255,255,255,.35);margin-left:8px;">· Entwickelt von S.Michlenz</span>
  <div class="spacer"></div>
  <span id="admin-name" style="font-size:13px;opacity:.7;"></span>
  <button class="btn btn-theme" id="themeBtn" onclick="toggleTheme()" title="Dunkelmodus umschalten">🌙</button>
  <button class="btn btn-logout" onclick="logout()">🚪 Abmelden</button>
</div>

<div id="main">
  <div>
    <div class="panel" style="margin-bottom:14px;">
      <h2>👥 Mitarbeiter</h2>
      <div id="user-list"></div>
    </div>
    <div class="panel">
      <h2>📅 Sondertage</h2>
      <div class="sd-row">
        <input type="date" id="sd-date"/>
        <select id="sd-type">
          <option value="inventur">📦 Inventur</option>
          <option value="closed">🔒 Geschlossen</option>
        </select>
        <input type="text" id="sd-label" placeholder="Beschreibung (optional)"/>
        <button class="sd-add" onclick="addSpecialDay()">+ Hinzufügen</button>
      </div>
      <div class="sd-list" id="sd-list"></div>
    </div>
  </div>

  <div class="panel">
    <h2 id="selected-name">Bitte einen Mitarbeiter wählen</h2>
    <div id="month-bar" style="display:none;">
      <button onclick="changeMonth(-1)">‹</button>
      <div id="month-lbl">—</div>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div id="lock-status">
      <span style="font-size:20px;">🔒</span>
      <div>
        <div>Monat abgeschlossen</div>
        <div class="lock-info" id="lock-info"></div>
      </div>
      <div class="spacer"></div>
      <button class="btn-release" onclick="releaseMonth()">🔓 Wieder freigeben</button>
    </div>
    <div id="stats" style="display:none;"></div>
    <div id="entries-area"></div>
  </div>
</div>

<script>
// Gesetzliche Feiertage Sachsen 2026
const FEIERTAGE={
  "2026-01-01":"Neujahr",
  "2026-04-03":"Karfreitag",
  "2026-04-06":"Ostermontag",
  "2026-05-01":"Tag der Arbeit",
  "2026-05-14":"Christi Himmelfahrt",
  "2026-05-25":"Pfingstmontag",
  "2026-10-03":"Tag der Deutschen Einheit",
  "2026-10-31":"Reformationstag",
  "2026-11-18":"Buß- und Bettag",
  "2026-12-25":"1. Weihnachtstag",
  "2026-12-26":"2. Weihnachtstag"
};
const WT=["So","Mo","Di","Mi","Do","Fr","Sa"];
const MON=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

let users=[], selectedUserId=null, currentEntries=[], currentSettings=null;
let currentLocks=[]; // MonthLocks des gewählten Mitarbeiters
let allLocks=[];     // Alle Locks aller Mitarbeiter (für Status-Indikator in der Liste)
let viewYear=new Date().getFullYear(), viewMonth=new Date().getMonth();

function dk(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
function daysIn(y,m){return new Date(y,m+1,0).getDate();}
function isSun(y,m,d){return new Date(y,m,d).getDay()===0;}
function isSat(y,m,d){return new Date(y,m,d).getDay()===6;}
function wtDay(y,m,d){return WT[new Date(y,m,d).getDay()];}
function getKW(y,m,d){
  const t=new Date(Date.UTC(y,m,d));
  t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
  const yStart=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil((((t-yStart)/86400000)+1)/7);
}

async function loadUsers(){
  const [uRes,lRes,sRes]=await Promise.all([
    fetch('/api/admin/users'),
    fetch('/api/admin/month-locks'),
    fetch('/api/special-days')
  ]);
  if(!uRes.ok){
    if(uRes.status===403){window.location.href='/admin-login';return;}
    return;
  }
  const data=await uRes.json();
  users=data.users||[];
  if(lRes.ok){const d=await lRes.json();allLocks=d.locks||[];}
  if(sRes.ok){const d=await sRes.json();specialDays=d.days||[];renderSpecialDays();}
  renderUsers();
}

let specialDays=[];

function renderSpecialDays(){
  const el=document.getElementById('sd-list');
  if(!el) return;
  if(!specialDays.length){
    el.innerHTML='<p style="color:var(--muted);font-size:13px;text-align:center;padding:14px;">Keine Sondertage angelegt</p>';
    return;
  }
  el.innerHTML='';
  specialDays.forEach(d=>{
    const div=document.createElement('div');div.className='sd-item';
    const dt=new Date(d.date+'T00:00:00');
    const wd=dt.toLocaleDateString('de-DE',{weekday:'short'}).replace('.','');
    const dateStr=wd+' '+String(dt.getDate()).padStart(2,'0')+'.'+String(dt.getMonth()+1).padStart(2,'0')+'.'+String(dt.getFullYear()).slice(2);
    const typeCls=d.type==='inventur'?'inv':'cls';
    const typeLbl=d.type==='inventur'?'📦 Inv':'🔒 Zu';
    div.innerHTML=`<span class="sd-date">${dateStr}</span>
      <span class="sd-tag ${typeCls}">${typeLbl}</span>
      <span class="sd-lbl">${d.label||''}</span>
      <button class="sd-del" onclick="deleteSpecialDay('${d.date}')" title="Löschen">✕</button>`;
    el.appendChild(div);
  });
}

async function addSpecialDay(){
  const date=document.getElementById('sd-date').value;
  const type=document.getElementById('sd-type').value;
  const label=document.getElementById('sd-label').value.trim();
  if(!date){alert('Bitte ein Datum wählen');return;}
  const res=await fetch('/api/admin/special-day',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({date,type,label})
  });
  if(res.ok){
    const d=await res.json();
    // Update lokale Liste
    specialDays=specialDays.filter(x=>x.date!==date).concat(d.day).sort((a,b)=>a.date.localeCompare(b.date));
    renderSpecialDays();
    document.getElementById('sd-date').value='';
    document.getElementById('sd-label').value='';
    if(selectedUserId) renderMonth(); // Tabelle des Mitarbeiters aktualisieren
  } else {
    alert('Fehler beim Speichern');
  }
}

async function deleteSpecialDay(date){
  if(!confirm('Diesen Sondertag wirklich löschen?')) return;
  const res=await fetch('/api/admin/special-day/'+date,{method:'DELETE'});
  if(res.ok){
    specialDays=specialDays.filter(x=>x.date!==date);
    renderSpecialDays();
    if(selectedUserId) renderMonth();
  }
}

function getSpecialDay(key){
  return specialDays.find(d=>d.date===key);
}

function userHasLockForView(uid){
  return allLocks.some(l=>l.userId===uid && l.year===viewYear && l.month===(viewMonth+1));
}

function renderUsers(){
  const el=document.getElementById('user-list');
  if(!users.length){
    el.innerHTML='<p style="color:#A09890;font-size:13px;text-align:center;padding:20px;">Keine Mitarbeiter</p>';
    return;
  }
  el.innerHTML='';
  users.forEach(u=>{
    const closed=userHasLockForView(u.id);
    const statusCls=closed?'month-closed':'month-open';
    const ico=closed?'✅':'⏳';
    const d=document.createElement('div');
    d.className='user-item '+statusCls+(u.id===selectedUserId?' active':'');
    d.innerHTML=`<div class="name">${u.name}<span class="lock-ind">${ico}</span></div>`;
    d.onclick=()=>selectUser(u.id);
    el.appendChild(d);
  });
}

async function selectUser(uid){
  selectedUserId=uid;
  renderUsers();
  const u=users.find(x=>x.id===uid);
  document.getElementById('selected-name').textContent=u.name+' — Zeiterfassung';
  document.getElementById('month-bar').style.display='flex';
  document.getElementById('stats').style.display='grid';

  // Lade Einträge + Settings + Locks
  const [eRes,sRes,lRes]=await Promise.all([
    fetch('/api/admin/entries/'+uid),
    fetch('/api/admin/settings/'+uid),
    fetch('/api/admin/month-locks/'+uid)
  ]);
  if(eRes.ok){const d=await eRes.json();currentEntries=d.entries||[];}
  if(sRes.ok){const d=await sRes.json();currentSettings=d.settings||null;}
  if(lRes.ok){const d=await lRes.json();currentLocks=d.locks||[];}
  renderMonth();
}

function isMonthLocked(y,m){
  return currentLocks.some(l=>l.year===y && l.month===(m+1));
}
function getLock(y,m){
  return currentLocks.find(l=>l.year===y && l.month===(m+1));
}

async function releaseMonth(){
  if(!selectedUserId) return;
  const lock=getLock(viewYear,viewMonth);
  if(!lock){toast?.("Kein Lock");return;}
  if(!confirm(`Monat ${MON[viewMonth]} ${viewYear} wieder freigeben?`)) return;
  const res=await fetch(`/api/admin/month-lock/${selectedUserId}/${viewYear}/${viewMonth+1}`,{method:'DELETE'});
  if(res.ok){
    currentLocks=currentLocks.filter(l=>!(l.year===viewYear && l.month===(viewMonth+1)));
    allLocks=allLocks.filter(l=>!(l.userId===selectedUserId && l.year===viewYear && l.month===(viewMonth+1)));
    renderMonth();
    renderUsers(); // Status (grün → rot) sofort aktualisieren
  } else {
    alert('Fehler beim Freigeben');
  }
}

function changeMonth(dir){
  viewMonth+=dir;
  if(viewMonth<0){viewMonth=11;viewYear--;}
  if(viewMonth>11){viewMonth=0;viewYear++;}
  renderMonth();
  renderUsers(); // Status-Farben (grün/rot) für neuen Monat aktualisieren
}

function renderMonth(){
  document.getElementById('month-lbl').textContent=MON[viewMonth]+' '+viewYear;
  if(!selectedUserId){return;}

  // Daten werden erst sichtbar wenn der Mitarbeiter den Monat abgeschlossen hat
  const isLocked=isMonthLocked(viewYear,viewMonth);
  if(!isLocked){
    document.getElementById('stats').style.display='none';
    document.getElementById('lock-status').classList.remove('locked');
    const u=users.find(x=>x.id===selectedUserId);
    document.getElementById('entries-area').innerHTML=`
      <div style="text-align:center;padding:50px 20px;color:var(--muted);">
        <div style="font-size:48px;margin-bottom:14px;">⏳</div>
        <div style="font-size:16px;font-weight:700;color:var(--txt);margin-bottom:6px;">
          Monat noch nicht abgeschlossen
        </div>
        <div style="font-size:13px;line-height:1.6;">
          ${u?u.name:'Der Mitarbeiter'} hat <strong>${MON[viewMonth]} ${viewYear}</strong> noch nicht freigegeben.<br>
          Du siehst die Daten erst nach dem Monatsabschluss durch den Mitarbeiter.
        </div>
      </div>
    `;
    return;
  }

  // Stats-Bereich wieder sichtbar
  document.getElementById('stats').style.display='grid';

  const wh=parseFloat(currentSettings?.wochenstunden)||38.5;
  const ts=wh/5;
  const days=daysIn(viewYear,viewMonth);
  const tLabels={urlaub:"Urlaub",zeitausgleich:"Zeitausgleich",krank:"Krank"};
  let work=0,urlaub=0,za=0,zaHalf=0,krank=0,totalMin=0;
  const entriesByKey={};
  currentEntries.forEach(e=>{entriesByKey[e.date]=e;});

  let rows='';
  for(let d=1;d<=days;d++){
    const key=dk(viewYear,viewMonth,d);
    const dayWT=wtDay(viewYear,viewMonth,d);
    const holiday=FEIERTAGE[key];
    const sun=isSun(viewYear,viewMonth,d);
    const sat=isSat(viewYear,viewMonth,d);
    const e=entriesByKey[key];
    const typ=e?e.type||'normal':'normal';
    // Feste Firmenregeln (unabhängig vom Admin)
    const isHeiligabend=(viewMonth===11&&d===24&&!sun&&!sat);
    const isSilvesterWD=(viewMonth===11&&d===31&&!sun&&!sat);

    const sd=getSpecialDay(key);
    let cls='', vonTxt='', bisTxt='', pauseTxt='', bemTxt='', netto='';
    if(holiday){cls='r-hol';vonTxt=holiday;bemTxt='Feiertag';netto=ts.toFixed(2).replace('.',',');}
    else if(sun){cls='r-we';vonTxt='Sonntag';}
    else if(sat){
      // Samstag: wenn Eintrag mit Zeiten vorhanden, diese anzeigen
      cls='r-sat';
      if(e&&e.von){
        vonTxt=e.von||'';bisTxt=e.bis||'';
        pauseTxt=e.pause?(e.pause+" min"):'';bemTxt=e.bemerkung||'';
        if(e.von&&e.bis){
          const [vh,vm]=e.von.split(':').map(Number);
          const [bh,bm]=e.bis.split(':').map(Number);
          const total=(bh*60+bm)-(vh*60+vm);const p=parseInt(e.pause||0)||0;
          const net=Math.max(0,total-p);
          if(net>0){work++;totalMin+=net;netto=(net/60).toFixed(2).replace('.',',');}
        }
      } else {
        vonTxt='Samstag';
      }
    }
    else if(isHeiligabend){
      // 24.12. auf Werktag = kostenloser freier Tag (Firmenregel)
      cls='r-hol';
      vonTxt='Heiligabend';
      bemTxt='Feiertag';
      netto=ts.toFixed(2).replace('.',',');
    }
    else if(isSilvesterWD){
      // 31.12. auf Werktag = ½ Tag ZA + ½ Tag gratis (Firmenregel)
      bemTxt='Halber Tag Zeitausgleich nehmen';
      if(typ==='zeitausgleich'){
        cls='r-za';
        vonTxt='Silvester';
        zaHalf++;
      } else if(e&&e.von){
        vonTxt=e.von||'';bisTxt=e.bis||'';
        pauseTxt=e.pause?(e.pause+" min"):'';
        if(e.von&&e.bis){
          const [vh,vm]=e.von.split(':').map(Number);
          const [bh,bm]=e.bis.split(':').map(Number);
          const total=(bh*60+bm)-(vh*60+vm);const p=parseInt(e.pause||0)||0;
          const net=Math.max(0,total-p);
          if(net>0){work++;totalMin+=net;netto=(net/60).toFixed(2).replace('.',',');}
        }
      } else {
        vonTxt='Silvester';
      }
    }
    else if(sd&&sd.type==='closed'){
      cls='r-closed';vonTxt='<span class="badge-typ b-closed">🔒 Geschlossen</span>'+(sd.label?' <span style="color:var(--txt2);font-size:11px;">'+sd.label+'</span>':'');
      netto=ts.toFixed(2).replace('.',',');
    }
    else if(typ==='urlaub'){cls='r-u';vonTxt='<span style="color:var(--u-t);font-weight:700;">Urlaub</span>';urlaub++;netto=ts.toFixed(2).replace('.',',');}
    else if(typ==='zeitausgleich'){cls='r-za';vonTxt='<span style="color:var(--za-t);font-weight:700;">Zeitausgleich</span>';za++;}
    else if(typ==='krank'){cls='r-k';vonTxt='<span style="color:var(--k-t);font-weight:700;">Krank</span>';krank++;netto=ts.toFixed(2).replace('.',',');}
    else if(e&&e.von){
      vonTxt=e.von||'';bisTxt=e.bis||'';
      pauseTxt=e.pause?(e.pause+" min"):'';bemTxt=e.bemerkung||'';
      if(e.von&&e.bis){
        const [vh,vm]=e.von.split(':').map(Number);
        const [bh,bm]=e.bis.split(':').map(Number);
        const total=(bh*60+bm)-(vh*60+vm);const p=parseInt(e.pause||0)||0;
        const net=Math.max(0,total-p);
        if(net>0){work++;totalMin+=net;netto=(net/60).toFixed(2).replace('.',',');}
      }
    }
    // Inventur-Badge zusätzlich an die WT-Spalte hängen
    const invBadge=(sd&&sd.type==='inventur')
      ? ` <span class="badge-typ b-inv" title="${sd.label||''}">📦 Inventur</span>` : '';
    const isMonday=new Date(viewYear,viewMonth,d).getDay()===1;
    const kwHtml=isMonday?`<span class="kw-badge">KW ${getKW(viewYear,viewMonth,d)}</span>`:'';
    const wtColor=cls==='r-hol'?'#6B21A8':(cls==='r-we'||cls==='r-sat')?'#DC2626':'#16A34A';
    rows+=`<tr class="${cls}">
      <td class="mono"><strong>${d}</strong></td>
      <td class="td-wt" style="color:${wtColor}">${dayWT}${kwHtml}${invBadge}</td>
      <td>${vonTxt}</td>
      <td class="mono">${bisTxt}</td>
      <td class="mono" style="color:var(--txt);font-weight:700;white-space:nowrap;">${pauseTxt}</td>
      <td style="color:#555;">${bemTxt}</td>
      <td class="mono" style="font-weight:700;color:#2563EB;">${netto?netto+' h':''}</td>
    </tr>`;
  }

  // Saldo berechnen
  let sollArbeitstage=0,closedDays=0;
  for(let d=1;d<=days;d++){
    const key=dk(viewYear,viewMonth,d);
    const sd2=getSpecialDay(key);
    const isClosed=sd2&&sd2.type==='closed';
    const isHb=viewMonth===11&&d===24&&!isSun(viewYear,viewMonth,d)&&!isSat(viewYear,viewMonth,d);
    const isSv=viewMonth===11&&d===31&&!isSun(viewYear,viewMonth,d)&&!isSat(viewYear,viewMonth,d);
    if(isClosed) closedDays++;
    if(isHb&&!FEIERTAGE[key]) closedDays++; // Heiligabend: volles Tagessoll gratis
    if(!isSun(viewYear,viewMonth,d)&&!isSat(viewYear,viewMonth,d)&&!FEIERTAGE[key]&&!isClosed&&!isHb){
      if(isSv) sollArbeitstage+=0.5; // Silvester: nur halber Tag Pflicht
      else sollArbeitstage++;
    }
  }
  // Geschlossene Tage (inkl. Heiligabend) zählen als bezahlt
  const istMin=totalMin+(urlaub+krank+closedDays)*ts*60;
  const sollMin=sollArbeitstage*ts*60;
  const saldo=istMin-sollMin;
  const sign=saldo>0?'+':saldo<0?'-':'±';
  const saldoStr=`${sign}${Math.abs(saldo/60).toFixed(2).replace('.',',')} h`;
  const saldoColor=saldo>0?'#16A34A':saldo<0?'#DC2626':'#888';

  // Zeitkonto = kumulativ vom letzten Anchor (mit Saldo-Addition der Zwischenmonate)
  const zaMin=(za+zaHalf*0.5)*ts*60; // Silvester-ZA zählt nur als halber Tag
  const empArr=currentSettings?.employees?JSON.parse(currentSettings.employees||'[]'):[];
  const overrideMap=(empArr[0]&&empArr[0].ueberstundenOverride)||{};
  const ustK=viewYear+"-"+String(viewMonth+1).padStart(2,"0");
  // Helfer: Anchor finden und summieren — für Admin-Sicht reicht der direkte Wert
  // (Saldi anderer Monate kennt der Admin nicht ohne deren Einträge zu laden)
  function adminLatestOverride(map,key){
    const ks=Object.keys(map).filter(x=>x<=key).sort();
    return ks.length?map[ks[ks.length-1]]:undefined;
  }
  const ovv=adminLatestOverride(overrideMap,ustK);
  const uH=(ovv!==undefined&&ovv!==null)?ovv:0;
  const uSign=uH>=0?'+':'';
  const uHStr=`${uSign}${uH.toFixed(2).replace('.',',')} h`;
  const uTage=ts>0?uH/ts:0;
  const tSign=uTage>=0?'+':'';
  const uTStr=`${tSign}${uTage.toFixed(2).replace('.',',')} T`;
  const uColor=uH>0?'var(--za-t)':uH<0?'var(--k-t)':'var(--txt2)';
  const uStr=`<span style="display:flex;justify-content:space-between;align-items:baseline;width:100%;">
    <span style="color:${uColor};">${uHStr}</span>
    <span style="color:${uColor};">${uTStr}</span>
  </span>`;

  // Urlaub: links = NUR dieser Monat genommen (rot), rechts = Jahres-Rest (grün)
  const anspruch=(empArr[0]&&empArr[0].urlaubsanspruch)||30;
  const urlaubMap=(empArr[0]&&empArr[0].urlaubGenommen)||{};
  // Anchor finden: letzter Override ≤ ustK, sonst Jahresanfang
  const ovKeys=Object.keys(urlaubMap).filter(x=>x<=ustK).sort();
  let startMonthKey, baseUrlaub;
  if(ovKeys.length>0){
    startMonthKey=ovKeys[ovKeys.length-1];
    baseUrlaub=urlaubMap[startMonthKey];
  } else {
    startMonthKey=viewYear+"-01";
    baseUrlaub=0;
  }
  // Alle Urlaubseinträge zwischen startMonthKey und ustK (inkl.) zählen für Rest
  let urlaubInRange=0;
  currentEntries.forEach(e=>{
    if(e.type!=='urlaub') return;
    const mk=e.date.substring(0,7);
    if(mk>=startMonthKey && mk<=ustK) urlaubInRange++;
  });
  const urlaubTotal=baseUrlaub+urlaubInRange;
  const urlaubRest=Math.max(0,anspruch-urlaubTotal);
  const urlaubMonthStr=urlaub>0?("-"+urlaub):"0";
  const urlaubStr=`<span style="display:flex;justify-content:space-between;align-items:baseline;width:100%;">
    <span style="color:var(--k-t);">${urlaubMonthStr}</span>
    <span style="color:var(--za-t);">${urlaubRest}</span>
  </span>`;

  // Zeitausgleich als negative Stunden (rote Schrift wenn genommen)
  const zaStr=(za+zaHalf)>0?`-${(zaMin/60).toFixed(2).replace('.',',')} h`:'0,00 h';
  const zaColor=(za+zaHalf)>0?'var(--k-t)':'var(--txt2)';

  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="lbl">Zeitkonto</div><div class="val" style="color:${uColor};">${uStr}</div></div>
    <div class="stat"><div class="lbl">Urlaub</div><div class="val amber">${urlaubStr}</div></div>
    <div class="stat"><div class="lbl">Zeitausgleich</div><div class="val" style="color:${zaColor};">${zaStr}</div></div>
    <div class="stat"><div class="lbl">Krank</div><div class="val red">${krank}</div></div>
    <div class="stat"><div class="lbl">Gesamt</div><div class="val blue">${totalMin>0?Math.floor(totalMin/60)+'h '+Math.round(totalMin%60)+'m':'—'}</div></div>
    <div class="stat"><div class="lbl">Saldo</div><div class="val" style="color:${saldoColor};">${(work+urlaub+krank+za+zaHalf)?saldoStr:'—'}</div></div>
  `;

  document.getElementById('entries-area').innerHTML=`
    <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Tag</th><th>WT</th><th>Von</th><th>Bis</th><th>Pause</th><th>Bemerkung</th><th>Netto</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p style="margin-top:14px;font-size:12px;color:#A09890;text-align:center;">
      🔒 Read-Only · Wochenstunden Soll: ${wh} h · Tagessoll: ${ts.toFixed(2).replace('.',',')} h
    </p>
  `;

  // Lock-Status-Banner
  const ls=document.getElementById('lock-status');
  if(isMonthLocked(viewYear,viewMonth)){
    const l=getLock(viewYear,viewMonth);
    const dt=l?.lockedAt?new Date(l.lockedAt).toLocaleDateString('de-DE'):'';
    document.getElementById('lock-info').textContent=
      `${MON[viewMonth]} ${viewYear}${dt?' · Mitarbeiter hat am '+dt+' abgeschlossen':''}`;
    ls.classList.add('locked');
  } else {
    ls.classList.remove('locked');
  }
}

async function logout(){
  await fetch('/api/logout',{method:'POST'});
  window.location.href='/admin-login';
}

// ── DARK MODE ───────────────────────────────────────────────────────────────
function applyTheme(dark){
  document.body.classList.toggle('dark',dark);
  document.getElementById('themeBtn').textContent=dark?'☀️':'🌙';
  document.getElementById('themeBtn').title=dark?'Hellmodus':'Dunkelmodus';
}
function toggleTheme(){
  const dark=!document.body.classList.contains('dark');
  localStorage.setItem('admin_dark',dark?'1':'0');
  applyTheme(dark);
}
// Beim Laden: gespeicherte Einstellung wiederherstellen
applyTheme(localStorage.getItem('admin_dark')==='1');

// Init
fetch('/api/user').then(r=>r.json()).then(d=>{
  if(d.name)document.getElementById('admin-name').textContent='👤 '+d.name;
});
loadUsers();
</script>
